<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Target Wars Client</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    canvas { border: 2px solid #333; margin-top: 20px; }
    #leaderboard { margin-top: 20px; list-style: none; padding: 0; }
    #leaderboard li { background: #f0f0f0; margin: 5px; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>🎯 Target Wars</h1>
  <button onclick="shoot()">Tirer</button>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <h2>Classement des joueurs</h2>
  <ul id="leaderboard"></ul>

  <script>
    const ws = new WebSocket("wss://target-wars-server.onrender.com");

    ws.onopen = () => {
      console.log("✅ Connecté au serveur Render !");
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "score") {
        updateLeaderboard(data.scores);
      }
    };

    function shoot() {
      ws.send("tir");
      drawShot();
    }

    // 🎨 Canvas setup
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function drawTarget() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Cercle extérieur
      ctx.beginPath();
      ctx.arc(200, 200, 150, 0, Math.PI * 2);
      ctx.fillStyle = "lightblue";
      ctx.fill();
      ctx.stroke();

      // Cercle intermédiaire
      ctx.beginPath();
      ctx.arc(200, 200, 100, 0, Math.PI * 2);
      ctx.fillStyle = "yellow";
      ctx.fill();
      ctx.stroke();

      // Cercle central
      ctx.beginPath();
      ctx.arc(200, 200, 50, 0, Math.PI * 2);
      ctx.fillStyle = "red";
      ctx.fill();
      ctx.stroke();
    }

    function drawShot() {
      const x = Math.random() * 400;
      const y = Math.random() * 400;
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = "black";
      ctx.fill();
    }

    drawTarget();

    function updateLeaderboard(scores) {
      const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
      document.getElementById("leaderboard").innerHTML =
        sorted.map(([player, score]) => `<li>${player}: ${score}</li>`).join("");
    }
  </script>
</body>
</html>
